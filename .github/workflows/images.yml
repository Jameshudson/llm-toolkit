name: images

# Build and publish the llm-toolkit images to GHCR:
#   ghcr.io/<owner>/llm-toolkit:{base,node,opencode,pi}
# Multi-arch (amd64 + arm64) so Apple Silicon pulls a native image.
#
# Repos consume these by setting LLM_REGISTRY=ghcr.io/<owner>/ — see the README.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/llm-toolkit:base
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: node
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/node/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: BASE_REF=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/llm-toolkit:base
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/llm-toolkit:node
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

      - name: opencode
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/opencode/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: NODE_REF=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/llm-toolkit:node
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/llm-toolkit:opencode
          cache-from: type=gha,scope=opencode
          cache-to: type=gha,mode=max,scope=opencode

      - name: pi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/pi/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: NODE_REF=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/llm-toolkit:node
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/llm-toolkit:pi
          cache-from: type=gha,scope=pi
          cache-to: type=gha,mode=max,scope=pi
